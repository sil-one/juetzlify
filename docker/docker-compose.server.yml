services:
  juetzli-fm:
    image: juetzli-fm
    container_name: juetzli-fm
    expose:
      - "3000"
    volumes:
      - ./tracks:/app/backend/tracks
      - ./cache:/app/backend/cache
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - juetzli-fm
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

# Usage on server:
# 1. Load the image: gunzip -c juetzli-fm.tar.gz | docker load
# 2. Create directories: mkdir -p tracks/public tracks/private cache
# 3. Copy this file and Caddyfile to server
# 4. Rename to docker-compose.yml or run: docker-compose -f docker-compose.server.yml up -d
