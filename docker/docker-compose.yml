services:
  juetzlify:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: juetzlify
    expose:
      - "3000"
    volumes:
      # Mount MP3 files from host
      - ./tracks:/app/backend/tracks
      # Persist album art cache
      - ./cache:/app/backend/cache
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - juetzlify
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

# Setup on server:
# mkdir -p tracks/public tracks/private cache
