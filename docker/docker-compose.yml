services:
  juetzlify:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: juetzlify
    expose:
      - "3000"
    volumes:
      # Mount MP3 files from host
      - ./tracks:/app/backend/tracks
      # Persist album art cache
      - ./cache:/app/backend/cache
      # Persist track visibility data
      - ./data:/app/backend/data
    env_file:
      - ./backend/.env
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - juetzlify
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

# Setup:
# 1. Create backend/.env file with your password hashes
# 2. mkdir -p tracks/all cache data backend
# 3. docker-compose up -d
